name: Factory .NET validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          foreach ($path in @('Build.ps1', 'Install-Dependencies.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Restore, build, test and publish
        shell: powershell
        run: .\Build.ps1
      - name: Verify published assets
        shell: powershell
        run: |
          foreach ($path in @('dist/Factory.exe', 'dist/skills/factory-plan/SKILL.md', 'dist/agents/builder.toml')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing published output: $path"
            }
          }
