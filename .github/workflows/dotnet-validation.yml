name: Factory .NET validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          foreach ($path in @('Build.ps1', 'Install-Dependencies.ps1',
                              'src/Factory/Providers/Codex/Setup.ps1', 'src/Factory/Providers/ClaudeCode/Setup.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Restore, build, test and publish
        shell: powershell
        run: |
          # Simulate rebuilding over a distribution from before provider-owned assets.
          New-Item -ItemType Directory -Force -Path 'dist/agents', 'dist/skills/factory-plan' | Out-Null
          Copy-Item -LiteralPath 'src/Factory/Providers/Codex/Assets/agents/builder.toml' -Destination 'dist/agents/builder.toml'
          Copy-Item -LiteralPath 'src/Factory/Providers/Codex/Assets/skills/factory-plan/SKILL.md' -Destination 'dist/skills/factory-plan/SKILL.md'
          .\Build.ps1
      - name: Set up Node.js for browser tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test Mission Control in Chromium
        working-directory: tests/mission-control
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium --only-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Verify published assets and provenance
        shell: powershell
        run: |
          foreach ($path in @('dist/Factory.exe', 'dist/build-manifest.json',
                             'dist/providers/codex/skills/factory-plan/SKILL.md', 'dist/providers/codex/agents/builder.toml')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing published output: $path"
            }
          }
          $manifest = Get-Content -Raw -LiteralPath dist/build-manifest.json | ConvertFrom-Json
          $reportedVersion = & .\dist\Factory.exe version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -ne $manifest.informationalVersion) {
            throw "Executable and manifest version mismatch."
          }
          $sha = (& git.exe rev-parse HEAD).Trim()
          if ($manifest.sourceSha -ne $sha) { throw "Manifest source commit mismatch." }
          $fileHash = (Get-FileHash -LiteralPath dist/Factory.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.executableSha256 -ne $fileHash) { throw "Artifact SHA-256 mismatch." }
      - name: Validate Windows package installation, upgrade and restore
        shell: pwsh
        run: dotnet ./tests/Factory.Tests/bin/Release/net10.0/Factory.Tests.dll --verify-windows-package ./dist
