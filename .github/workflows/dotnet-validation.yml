name: Factory .NET validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Factory.slnx
      - name: Build
        run: dotnet build Factory.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet run --project tests/Factory.Tests/Factory.Tests.csproj --configuration Release --no-restore
